<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>YouTube 文字起こし</title>
  <meta name="theme-color" content="#ff0033" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="文字起こし" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎬 YouTube 文字起こし</h1>
    <p class="subtitle">URL を入れるだけ — 動画で話している内容を全文テキストに</p>
  </header>

  <main>
    <!-- 入力 -->
    <section class="card input-card">
      <form id="urlForm" class="url-form">
        <input
          type="text"
          id="urlInput"
          inputmode="url"
          autocomplete="off"
          placeholder="https://www.youtube.com/watch?v=..."
          required
        />
        <button type="submit" id="goBtn" class="btn primary">文字起こし</button>
      </form>
      <p id="status" class="status hidden"></p>
    </section>

    <!-- 結果 -->
    <section id="result" class="card result-card hidden">
      <div class="video-head">
        <img id="thumb" class="thumb" alt="" />
        <div class="video-info">
          <h2 id="vidTitle"></h2>
          <p id="vidMeta" class="muted"></p>
        </div>
      </div>

      <div class="toolbar">
        <label class="tool-field">
          字幕
          <select id="langSelect"></select>
        </label>
        <label class="ts-toggle">
          <input type="checkbox" id="tsToggle" /> ⏱ タイムスタンプ
        </label>
        <span class="spacer"></span>
        <button id="copyBtn" class="btn">📋 コピー</button>
        <button id="downloadBtn" class="btn">⬇ 保存(.txt)</button>
      </div>

      <p id="wordCount" class="muted count"></p>
      <div id="transcript" class="transcript"></div>
    </section>

    <!-- 履歴 -->
    <section class="card history-card">
      <div class="section-head">
        <h2>🕘 履歴</h2>
        <button id="clearHistory" class="btn ghost small hidden">すべて削除</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>

    <!-- 設定 -->
    <section class="card settings-card">
      <details>
        <summary>⚙ 詳細設定（CORS プロキシ）</summary>
        <p class="muted small">
          ブラウザから直接 YouTube を取得できないため、中継用の CORS プロキシを使います。
          うまく取得できないときは、別のプロキシURLを入力してください
          （対象URLは末尾に付与されます。<code>{url}</code> を書くとその位置に挿入されます）。
        </p>
        <div class="proxy-row">
          <input
            type="text"
            id="proxyInput"
            autocomplete="off"
            placeholder="例) https://api.allorigins.win/raw?url="
          />
          <button id="saveProxy" class="btn">保存</button>
        </div>
        <p id="proxyHint" class="muted small"></p>
      </details>
    </section>
  </main>

  <footer class="app-footer">
    <span>個人利用向け・サーバー不要 / データはこの端末にのみ保存されます</span>
    <span id="appVersion" class="version"></span>
  </footer>

  <script src="src/app.js"></script>
  <script>
    // オフライン対応（PWA）
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
