name: Deploy to GitHub Pages

# このワークフローは2つのアプリを1つの GitHub Pages サイトにまとめて公開します。
#   /          … カスタムメモ帳アプリ（claude/custom-notepad-app-1zmccx ブランチ）
#   /youtube/  … YouTube 文字起こしアプリ（このブランチ）
on:
  push:
    branches:
      - claude/youtube-transcription-app-fk8k8c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout notepad app (site root)
        uses: actions/checkout@v4
        with:
          ref: claude/custom-notepad-app-1zmccx
          path: site

      - name: Checkout YouTube app (/youtube)
        uses: actions/checkout@v4
        with:
          ref: claude/youtube-transcription-app-fk8k8c
          path: site/youtube

      - name: Strip git/CI metadata from artifact
        run: |
          rm -rf site/.git site/.github site/youtube/.git site/youtube/.github

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
