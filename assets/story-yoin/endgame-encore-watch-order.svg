<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">初見向けエンドゲーム最短予習ルート</title>
  <desc id="desc">インフィニティ・ウォーからエンドゲーム・アンコールへ進み、余裕があれば4作品を補完する視聴順</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101e"/><stop offset=".55" stop-color="#111c3e"/><stop offset="1" stop-color="#30144c"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="final" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1120" cy="90" r="190" fill="none" stroke="#a78bfa" stroke-opacity=".18" stroke-width="20"/>
  <text x="70" y="74" fill="#c4b5fd" font-size="25" font-weight="700" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">MCUをほとんど見ていない人へ</text>
  <text x="70" y="130" fill="#ffffff" font-size="49" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">初見向け｜最短予習ルート</text>
  <rect x="70" y="160" width="340" height="45" rx="22.5" fill="#ef4444"/>
  <text x="240" y="190" text-anchor="middle" fill="#fff" font-size="22" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">最低限、この2本で大筋を追える</text>

  <line x1="310" y1="330" x2="875" y2="330" stroke="url(#route)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="875,330 835,300 835,360" fill="#c084fc"/>

  <g transform="translate(85 245)">
    <rect width="390" height="180" rx="28" fill="#0b2942" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="65" cy="65" r="42" fill="#0284c7"/>
    <text x="65" y="80" text-anchor="middle" fill="#fff" font-size="42" font-weight="900" font-family="Arial, sans-serif">1</text>
    <text x="125" y="60" fill="#bae6fd" font-size="22" font-weight="800" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">直前作・必須級</text>
    <text x="125" y="104" fill="#fff" font-size="30" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">インフィニティ・ウォー</text>
    <text x="40" y="151" fill="#cbd5e1" font-size="20" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">サノスの目的・消滅・敗北直後が分かる</text>
  </g>

  <g transform="translate(725 245)">
    <rect width="390" height="180" rx="28" fill="#3d1b39" stroke="#fb923c" stroke-width="3"/>
    <circle cx="65" cy="65" r="42" fill="url(#final)"/>
    <text x="65" y="80" text-anchor="middle" fill="#fff" font-size="42" font-weight="900" font-family="Arial, sans-serif">2</text>
    <text x="125" y="60" fill="#fed7aa" font-size="22" font-weight="800" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">映画館で鑑賞</text>
    <text x="125" y="104" fill="#fff" font-size="30" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">エンドゲーム：アンコール</text>
    <text x="40" y="151" fill="#fde7d6" font-size="20" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">長年の物語の結末と新映像を体験</text>
  </g>

  <text x="70" y="492" fill="#e9d5ff" font-size="27" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">余裕があれば、この4本で感情の深さが増す</text>
  <g font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">
    <g transform="translate(70 520)"><rect width="250" height="100" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#64748b"/><text x="125" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">アイアンマン</text><text x="125" y="74" text-anchor="middle" fill="#cbd5e1" font-size="17">トニーの出発点</text></g>
    <g transform="translate(340 520)"><rect width="250" height="100" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#64748b"/><text x="125" y="36" text-anchor="middle" fill="#fff" font-size="19" font-weight="900">キャプテン・アメリカ</text><text x="125" y="62" text-anchor="middle" fill="#fff" font-size="19" font-weight="900">ザ・ファースト・アベンジャー</text><text x="125" y="86" text-anchor="middle" fill="#cbd5e1" font-size="16">スティーブの原点</text></g>
    <g transform="translate(610 520)"><rect width="250" height="100" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#64748b"/><text x="125" y="42" text-anchor="middle" fill="#fff" font-size="21" font-weight="900">アントマン＆ワスプ</text><text x="125" y="74" text-anchor="middle" fill="#cbd5e1" font-size="17">量子世界の補完</text></g>
    <g transform="translate(880 520)"><rect width="250" height="100" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#64748b"/><text x="125" y="42" text-anchor="middle" fill="#fff" font-size="21" font-weight="900">キャプテン・マーベル</text><text x="125" y="74" text-anchor="middle" fill="#cbd5e1" font-size="17">キャロルの能力</text></g>
  </g>
  <text x="600" y="651" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">時間がない場合は「インフィニティ・ウォー」だけでも先に見るのがおすすめ</text>
</svg>