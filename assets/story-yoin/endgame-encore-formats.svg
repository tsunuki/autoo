<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">スタンダード版とINFINITY VISION版の違い</title>
  <desc id="desc">追加映像、上映環境、向いている人を比較した図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset=".5" stop-color="#101b37"/><stop offset="1" stop-color="#2b1247"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#075985"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="265" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="38"/>
  <circle cx="600" cy="340" r="205" fill="none" stroke="#a78bfa" stroke-opacity=".12" stroke-width="3"/>
  <text x="600" y="74" text-anchor="middle" fill="#c4b5fd" font-size="25" font-weight="700" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">どちらにも新映像あり</text>
  <text x="600" y="128" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">スタンダード版とINFINITY VISION版の違い</text>

  <g transform="translate(70 185)" filter="url(#shadow)">
    <rect width="500" height="390" rx="30" fill="#0b253d" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="80" rx="30" fill="url(#left)"/>
    <rect x="0" y="50" width="500" height="30" fill="url(#left)"/>
    <text x="250" y="53" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">スタンダード版</text>
    <g transform="translate(50 118)" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">
      <circle cx="25" cy="25" r="25" fill="#0284c7"/><text x="25" y="34" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">1</text>
      <text x="75" y="20" fill="#bae6fd" font-size="22" font-weight="800">追加映像</text><text x="75" y="53" fill="#fff" font-size="31" font-weight="900">オリジナル版より＋2分</text>
      <circle cx="25" cy="115" r="25" fill="#0284c7"/><text x="25" y="124" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">2</text>
      <text x="75" y="110" fill="#bae6fd" font-size="22" font-weight="800">上映劇場</text><text x="75" y="143" fill="#fff" font-size="27" font-weight="900">近くの劇場で選びやすい</text>
      <circle cx="25" cy="205" r="25" fill="#0284c7"/><text x="25" y="214" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">3</text>
      <text x="75" y="200" fill="#bae6fd" font-size="22" font-weight="800">向いている人</text><text x="75" y="233" fill="#fff" font-size="26" font-weight="900">移動・上映時間を優先したい</text>
    </g>
  </g>

  <g transform="translate(630 185)" filter="url(#shadow)">
    <rect width="500" height="390" rx="30" fill="#291449" stroke="#d8b4fe" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="80" rx="30" fill="url(#right)"/>
    <rect x="0" y="50" width="500" height="30" fill="url(#right)"/>
    <text x="250" y="53" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">INFINITY VISION版</text>
    <g transform="translate(50 118)" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">
      <circle cx="25" cy="25" r="25" fill="#9333ea"/><text x="25" y="34" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">1</text>
      <text x="75" y="20" fill="#e9d5ff" font-size="22" font-weight="800">追加映像</text><text x="75" y="53" fill="#fff" font-size="31" font-weight="900">オリジナル版より＋5分</text>
      <circle cx="25" cy="115" r="25" fill="#9333ea"/><text x="25" y="124" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">2</text>
      <text x="75" y="110" fill="#e9d5ff" font-size="22" font-weight="800">上映環境</text><text x="75" y="143" fill="#fff" font-size="25" font-weight="900">大画面・認定音響・映写品質</text>
      <circle cx="25" cy="205" r="25" fill="#9333ea"/><text x="25" y="214" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">3</text>
      <text x="75" y="200" fill="#e9d5ff" font-size="22" font-weight="800">向いている人</text><text x="75" y="233" fill="#fff" font-size="25" font-weight="900">新映像と劇場体験を最大化</text>
    </g>
  </g>

  <rect x="175" y="604" width="850" height="48" rx="24" fill="#f59e0b"/>
  <text x="600" y="636" text-anchor="middle" fill="#1f1300" font-size="23" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">迷ったら：追加映像を最大限見たい人はINFINITY VISION版</text>
</svg>