<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">重大なネタバレ注意</title>
  <desc id="desc">ここから先はアベンジャーズ／エンドゲーム本編の重大なネタバレを含むという警告画像</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#170509"/><stop offset=".5" stop-color="#330811"/><stop offset="1" stop-color="#10040c"/></linearGradient>
    <radialGradient id="flare" cx="50%" cy="45%" r="60%"><stop stop-color="#ef4444" stop-opacity=".38"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#flare)"/>
  <path d="M0 90 L1200 10 M0 480 L1200 400" stroke="#ef4444" stroke-opacity=".18" stroke-width="40"/>
  <path d="M50 30 H1150" stroke="#f87171" stroke-width="3"/>
  <path d="M50 470 H1150" stroke="#f87171" stroke-width="3"/>

  <g transform="translate(105 132)" filter="url(#glow)">
    <path d="M90 0 L180 160 H0 Z" fill="#ef4444"/>
    <rect x="82" y="46" width="16" height="61" rx="8" fill="#fff"/>
    <circle cx="90" cy="130" r="10" fill="#fff"/>
  </g>

  <text x="720" y="155" text-anchor="middle" fill="#fecaca" font-size="30" font-weight="800" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">WARNING</text>
  <text x="720" y="235" text-anchor="middle" fill="#ffffff" font-size="62" font-weight="900" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">ここから重大なネタバレ</text>
  <text x="720" y="292" text-anchor="middle" fill="#fca5a5" font-size="27" font-weight="800" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">『アベンジャーズ／エンドゲーム』本編の結末に触れます</text>
  <rect x="445" y="342" width="550" height="70" rx="35" fill="#ffffff" fill-opacity=".1" stroke="#f87171" stroke-width="2"/>
  <text x="720" y="386" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">未鑑賞の方は、映画を見てから戻ってきてください</text>
</svg>